<!-- Шрифти за логотипом: Noto Serif Display 800 (антиква, як «N»), Raleway 300/400/500 (гротеск, як NOVITA і BEAUTY SALON). Кирилицю перевірено. Запасні шрифти в --f-* -->

<style>
/* ===== БЛОК: токени (бренд NOVITA: чорно-білий монохром, чорний логотипу #211917) ===== */
:root{
  --bg:#F3F1F0; --card:#FFFFFF; --surface:#E9E6E4;
  --text:#211917; --t2:#554C49; --t3:#6B6360;
  --line:rgba(33,25,23,.16); --line-s:rgba(33,25,23,.42);
  --btn:#211917; --btn-fg:#FFFFFF; --btn-hover:#5B4F4B;
  --bar:#211917; --on-bar:#FFFFFF; --on-bar-2:rgba(255,255,255,.74);
  --fab:#FFFFFF; --fab-fg:#211917;
  --ph-a:#4A3F3B; --ph-b:#211917; --ph-line:rgba(255,255,255,.08); --ph-fg:#FFFFFF;
  --shadow:0 1px 2px rgba(33,25,23,.05),0 14px 32px -10px rgba(33,25,23,.16);
  --shadow-bar:0 18px 40px -12px rgba(33,25,23,.5);
  --f-serif:'Noto Serif Display',Georgia,'Times New Roman',serif;
  --f-sans:'Raleway',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --r-s:16px; --r-m:28px; --r-l:36px; --r-xl:44px; --pill:999px;
  --gut:20px;
  color-scheme:light;
  --safe-b:max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px));
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141010; --card:#201A18; --surface:#2B2321;
  --text:#F4F1EF; --t2:#CBC4C0; --t3:#ABA3A0;
  --line:rgba(244,241,239,.16); --line-s:rgba(244,241,239,.44);
  --btn:#F4F1EF; --btn-fg:#211917; --btn-hover:#BEB6B2;
  --bar:#2E2624; --on-bar:#F4F1EF; --on-bar-2:rgba(244,241,239,.74);
  --fab:#F4F1EF; --fab-fg:#211917;
  --ph-a:#3A302D; --ph-b:#2B2321;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 32px -10px rgba(0,0,0,.6);
  --shadow-bar:0 18px 40px -12px rgba(0,0,0,.7);
}

/* ===== БЛОК: база й типографіка (серіф як «N» у лого, гротеск як NOVITA/BEAUTY SALON) ===== */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-sans);font-weight:400;font-size:16px;line-height:1.55;font-variant-numeric:lining-nums;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select{font:inherit;color:inherit;font-variant-numeric:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed}
h1,h2,h3,p,dl,dd{margin:0}
h1,h2,h3{font-family:var(--f-serif);font-weight:800;hyphens:none;text-wrap:balance}
h1{font-size:clamp(1.9rem,9vw,2.45rem);line-height:1;letter-spacing:-.01em;margin-bottom:18px}
h2{font-size:1.55rem;line-height:1.05;letter-spacing:-.005em}
h3{font-size:1.2rem;line-height:1.1;letter-spacing:0}
p{text-wrap:pretty;max-width:56ch}
a{color:inherit}
a[href^="tel:"]{white-space:nowrap}
a.btn,a.btn-line{text-decoration:none}
:focus-visible{outline:2px solid var(--text);outline-offset:3px}
main:focus,main:focus-visible{outline:0}
.ico{width:22px;height:22px;flex:none}
.cap{font-family:var(--f-sans);font-weight:500;font-size:.6875rem;line-height:1.5;letter-spacing:.14em;text-transform:uppercase;color:var(--t2)}
.thin{font-weight:300}
.small{font-size:.875rem;line-height:1.45}
.t2{color:var(--t2)} .t3{color:var(--t3)}
.grow{flex:1}
.lead{margin:-6px 0 22px;color:var(--t2);font-weight:300;font-size:1rem}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
dl{margin:0}

/* ===== БЛОК: каркас ===== */
#app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative}
.top{display:flex;align-items:center;gap:10px;padding:calc(12px + var(--tg-content-safe-area-inset-top,0px)) var(--gut) 8px;min-height:68px}
.top.over{position:absolute;left:0;right:0;top:0;z-index:4}
.mark{display:flex;flex-direction:column;gap:5px}
.mark b{font-weight:500;font-size:1.0625rem;letter-spacing:.16em;line-height:1}
.mark span{font-weight:300;font-size:.625rem;letter-spacing:.3em;text-transform:uppercase;line-height:1;white-space:nowrap}
.top .ttl{margin:0}
main{padding:6px var(--gut) calc(128px + var(--safe-b));outline:0}
main.flow{padding-bottom:calc(168px + var(--safe-b))}
main.detail{padding:0 0 calc(150px + var(--safe-b))}
section+section{margin-top:36px}
.iconbtn{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--card);box-shadow:var(--shadow);transition:transform 620ms var(--ease)}
.iconbtn:active{transform:scale(.94)}
.badge{position:absolute;right:-2px;top:-2px;min-width:18px;height:18px;border-radius:9px;padding:0 5px;background:var(--btn);color:var(--btn-fg);font-size:.6875rem;font-weight:500;display:grid;place-items:center;line-height:1}

/* ===== БЛОК: кнопки, чіпи ===== */
.btn,.btn-line{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 30px;border-radius:var(--pill);text-align:center;font-weight:500;font-size:.8125rem;letter-spacing:.12em;text-transform:uppercase;line-height:1.3}
.btn{background:var(--btn);color:var(--btn-fg)}
.btn::before{content:"";position:absolute;inset:0;background:var(--btn-hover);transform:scaleX(0);transform-origin:left;transition:transform 500ms var(--ease);z-index:-1}
.btn:hover:not(:disabled)::before,.btn:active:not(:disabled)::before{transform:scaleX(1)}
.btn>span{transition:letter-spacing 520ms var(--ease)}
.btn:hover:not(:disabled)>span{letter-spacing:.15em}
.btn-line{box-shadow:inset 0 0 0 1.5px var(--line-s);transition:background 320ms var(--ease)}
.btn-line:hover:not(:disabled){background:var(--card)}
.btn.block,.btn-line.block{width:100%}
.btn:disabled,.btn-line:disabled{opacity:.4}
.btn.sm,.btn-line.sm{min-height:44px;padding:0 20px;font-size:.75rem}
.is-busy{pointer-events:none}
.is-busy::after{content:"";width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin 800ms var(--ease) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cta-note{display:block;margin-top:10px;font-size:.75rem;line-height:1.4;color:var(--t2);text-align:center;font-weight:400}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:var(--pill);background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);font-size:.9375rem;white-space:nowrap;transition:background 320ms var(--ease),color 320ms var(--ease)}
.chip.sm{min-height:36px;padding:0 14px;font-size:.8125rem}
.chip.on{background:var(--btn);color:var(--btn-fg);box-shadow:none}
.chip.demo{min-height:34px;padding:0 13px;font-size:.6875rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;background:var(--card);color:var(--t2);box-shadow:inset 0 0 0 1.5px var(--line)}
.chip.dis{opacity:.5;text-decoration:line-through;cursor:not-allowed}
.go{width:40px;height:40px;border-radius:50%;background:var(--btn);color:var(--btn-fg);display:grid;place-items:center;flex:none;transition:transform 620ms var(--ease)}
.go .ico{width:18px;height:18px}
.go.sm{width:30px;height:30px}.go.sm .ico{width:15px;height:15px}
button:hover>.go,summary:hover .go{transform:translateX(3px)}
.lnk{text-decoration:underline;text-underline-offset:3px;display:inline;min-height:0;color:inherit}
a.lnk{display:inline}

/* ===== БЛОК: фото-заглушки ===== */
.ph{position:relative;color:var(--ph-fg);overflow:hidden;background:repeating-linear-gradient(135deg,var(--ph-line) 0 1px,transparent 1px 16px),linear-gradient(160deg,var(--ph-a),var(--ph-b))}
.ph .cap{position:absolute;left:22px;top:22px;color:var(--ph-fg);opacity:.86}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.cover{height:340px;border-radius:var(--r-xl);margin:2px 0 0;display:flex;flex-direction:column;justify-content:flex-end;padding:26px 22px 24px}
.cover{position:relative}
.cover-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:38% 60%}
/* темний градієнт знизу за вказівкою власника: білий напис лишається читабельним (контраст розрахований) */
.cover:has(.cover-img)::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(33,25,23,.92) 0%,rgba(33,25,23,.7) 38%,rgba(33,25,23,.18) 68%,rgba(33,25,23,0) 100%)}
.cover .cv{position:relative;z-index:1;display:flex;align-items:flex-end;gap:14px}
.cover h1,.cover p{text-shadow:0 1px 10px rgba(33,25,23,.55)}
.cover-prev{position:relative;aspect-ratio:16/10;border-radius:var(--r-m);overflow:hidden;background:var(--surface);display:grid;place-items:center}
.cover-prev img{width:100%;height:100%;object-fit:cover}
.cover h1{margin:0;color:var(--ph-fg);font-size:clamp(1.8rem,8.4vw,2.2rem)}
.cover p{color:var(--ph-fg);opacity:.94;font-weight:300;font-size:.9375rem;margin-top:8px}
.cover .go{background:var(--ph-fg);color:var(--ph-b);width:52px;height:52px}
.cover .go .ico{width:22px;height:22px}
.dh{height:320px;border-radius:0 0 var(--r-xl) var(--r-xl)}
.dh .cap{top:auto;bottom:58px;left:auto;right:22px}
.sheet-up{position:relative;margin-top:-36px;background:var(--card);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:30px var(--gut) 24px;min-height:300px}
.ava{width:60px;height:60px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-serif);font-weight:800;font-size:1.25rem;color:var(--t2);flex:none;overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover}
.ava.xl{width:96px;height:96px;font-size:2rem}
.tile{aspect-ratio:4/3;border-radius:var(--r-s);display:flex;align-items:flex-end;padding:12px;font-size:.75rem;color:var(--ph-fg);background:repeating-linear-gradient(135deg,var(--ph-line) 0 1px,transparent 1px 14px),linear-gradient(160deg,var(--ph-a),var(--ph-b))}

/* ===== БЛОК: рядки-кнопки, списки, картки ===== */
.rowbtn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:58px;padding:0 24px;border-radius:var(--pill);box-shadow:inset 0 0 0 1.5px var(--line-s);font-size:1rem;transition:background 320ms var(--ease)}
.rowbtn:hover{background:var(--card)}
.rowbtn .ico{width:20px;height:20px;transition:transform 520ms var(--ease)}
.rowbtn:hover .ico{transform:translateX(4px)}
.rowbtn+.rowbtn{margin-top:12px}
.list{background:var(--card);border-radius:var(--r-m);box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;gap:14px;align-items:center;width:100%;padding:18px 18px 18px 22px;min-height:84px;transition:background 320ms var(--ease)}
.item+.item{box-shadow:inset 0 1px 0 var(--line)}
.item:hover{background:color-mix(in srgb,var(--text) 4%,transparent)}
.item .main{flex:1;min-width:0;display:block}
.item .nm{display:block;font-weight:500;font-size:1rem;line-height:1.3}
.item .sub{display:block;font-weight:300;font-size:.8125rem;line-height:1.4;color:var(--t2);margin-top:3px}
.foot{display:flex;align-items:baseline;gap:6px 14px;margin-top:8px;flex-wrap:wrap}
.price{font-family:var(--f-serif);font-weight:800;font-size:1.2rem;line-height:1.1;white-space:nowrap}
.price .pre{font-family:var(--f-sans);font-weight:500;font-size:.6875rem;letter-spacing:.12em;text-transform:uppercase;color:var(--t2);margin-right:4px}
.price .cur{font-family:var(--f-sans);font-weight:500;font-size:.75rem;letter-spacing:.06em;color:var(--t2)}
.price.ask{font-family:var(--f-sans);font-weight:500;font-size:.875rem}
.tag{display:inline-block;padding:2px 9px;border-radius:var(--pill);box-shadow:inset 0 0 0 1.2px var(--line-s);font-size:.625rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--t2);white-space:nowrap}
.mcard{display:block;width:100%;background:var(--card);border-radius:var(--r-m);box-shadow:var(--shadow);padding:20px;transition:transform 620ms var(--ease)}
.mcard+.mcard{margin-top:14px}
.mcard:active{transform:scale(.99)}
.mhead{display:flex;gap:14px;align-items:center}
.mhead .nm{font-family:var(--f-serif);font-weight:800;font-size:1.3rem;line-height:1.05;letter-spacing:-.01em;display:block}
.rate{display:inline-flex;align-items:center;gap:6px;font-size:.875rem;margin-top:4px}
.rate .ico{width:15px;height:15px}
.wins{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.head-row{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}
.head-row h1{margin:0;flex:1}
.fsum{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-4px 0 18px;padding:12px 18px;border-radius:var(--pill);box-shadow:inset 0 0 0 1.5px var(--line);font-size:.8125rem}
.emptyb{padding:30px 0}
.emptyb p{margin:10px 0 22px;color:var(--t2)}
.cats-h{margin:0 0 14px}
.about{margin-top:34px}
.about p{color:var(--t2);font-weight:300;font-size:1rem;margin:12px 0 22px}
.contact{background:var(--card);border-radius:var(--r-m);box-shadow:var(--shadow);padding:22px}
.contact dl>div{padding:12px 0}
.contact dl>div+div{box-shadow:inset 0 1px 0 var(--line)}
.contact dt{margin-bottom:2px}
.contact dd{font-size:1rem}
.contact .btn{margin-top:14px}
.fine{margin-top:28px;font-size:.75rem;line-height:1.5;color:var(--t3);font-weight:400}

/* ===== БЛОК: деталі (акордеон) ===== */
.acc{border-top:1px solid var(--line)}
.acc:last-of-type{border-bottom:1px solid var(--line)}
.acc summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;cursor:pointer;font-weight:500;font-size:.9375rem}
.acc summary::-webkit-details-marker{display:none}
.acc summary .go{background:var(--btn);transition:transform 520ms var(--ease)}
.acc[open] summary .go{transform:rotate(90deg)}
.acc-b{padding:0 0 20px;color:var(--t2);font-size:.9375rem;font-weight:400}
.acc-b p+p{margin-top:8px}
.zone{display:flex;justify-content:space-between;gap:12px;padding:10px 0;font-size:.9375rem}
.zone+.zone{box-shadow:inset 0 1px 0 var(--line)}
.week .day{padding:12px 0}
.week .day+.day{box-shadow:inset 0 1px 0 var(--line)}
.port{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ===== БЛОК: запис ===== */
.prog{display:flex;gap:6px;margin:4px 0 10px}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--line);transition:background 500ms var(--ease)}
.prog i.on{background:var(--text)}
.step-l{margin-bottom:18px}
.picks{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:16px 16px 16px 20px;border-radius:var(--r-m);background:var(--card);box-shadow:var(--shadow);min-height:76px;transition:transform 620ms var(--ease)}
.opt+.opt{margin-top:12px}
.opt:active{transform:scale(.99)}
.opt .ot{display:block;font-weight:500;font-size:1rem}
.opt .os{display:block;font-weight:300;font-size:.8125rem;color:var(--t2);margin-top:2px}
.strip{display:flex;gap:8px;overflow-x:auto;margin:0 calc(var(--gut) * -1) 22px;padding:2px var(--gut) 8px;scroll-snap-type:x proximity;scroll-padding-left:var(--gut);scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.dbtn{flex:none;width:60px;min-height:82px;border-radius:24px;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;scroll-snap-align:start;transition:background 320ms var(--ease),color 320ms var(--ease)}
.dbtn b{font-family:var(--f-serif);font-weight:800;font-size:1.45rem;line-height:1}
.dbtn span{font-size:.625rem;font-weight:500;text-transform:uppercase;letter-spacing:.12em;color:var(--t2)}
.dbtn[aria-pressed="true"]{background:var(--btn);color:var(--btn-fg)}
.dbtn[aria-pressed="true"] span{color:var(--btn-fg)}
.dbtn:disabled{opacity:.45;box-shadow:none;background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.dbtn.off{background:repeating-linear-gradient(135deg,var(--line) 0 1px,transparent 1px 7px)}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.times .chip{padding:0}
.times .sk{height:48px;border-radius:var(--pill)}
.callout{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-radius:var(--r-s);background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line-s);font-size:.9375rem;line-height:1.5;font-weight:500}
.callout .ico{width:22px;height:22px;margin-top:1px}
.legal{margin-top:20px;text-align:left}
.note{display:flex;gap:10px;margin-top:16px;font-size:.8125rem;line-height:1.45;color:var(--t2)}
.note .ico{width:18px;height:18px;margin-top:1px}
.sum{background:var(--card);border-radius:var(--r-m);padding:6px 22px}
.sum div{display:flex;justify-content:space-between;gap:16px;padding:14px 0}
.sum div+div{box-shadow:inset 0 1px 0 var(--line)}
.sum dt{font-size:.6875rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--t2);padding-top:3px}
.sum dd{text-align:right;font-size:.9375rem}
.sum dd small{display:block;color:var(--t3);font-size:.75rem}
form{margin-top:26px;display:grid;gap:18px}
.fld .cap{display:block;margin:0 0 8px 8px}
.fld input[type=text],.fld input[type=tel],.fld input[type=number],.fld select{width:100%;min-height:56px;padding:0 24px;border-radius:var(--pill);border:0;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);font-size:1rem}
.fld select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text) 50%),linear-gradient(135deg,var(--text) 50%,transparent 50%);background-position:calc(100% - 26px) 50%,calc(100% - 20px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:48px}
.fld input:focus-visible,.fld select:focus-visible{outline:0;box-shadow:inset 0 0 0 2px var(--text)}
.fld input[aria-invalid="true"]{box-shadow:inset 0 0 0 2.5px var(--text)}
.err{display:flex;gap:8px;align-items:flex-start;margin:8px 0 0 8px;font-size:.8125rem;font-weight:500}
.err:empty{display:none}
.err .ico{width:16px;height:16px;margin-top:2px}
.consent{display:flex;gap:14px;align-items:flex-start;font-size:.875rem;line-height:1.45}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:26px;height:26px;margin:0;flex:none;border-radius:9px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line-s);position:relative;cursor:pointer;transition:background 320ms var(--ease)}
input[type=checkbox]:checked{background:var(--btn);box-shadow:none}
input[type=checkbox]:checked::after{content:"";position:absolute;left:9px;top:4px;width:6px;height:12px;border:solid var(--btn-fg);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
input[type=checkbox][role=switch]{width:54px;height:32px;border-radius:var(--pill)}
input[type=checkbox][role=switch]::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border:0;border-radius:50%;background:var(--text);transform:none;transition:transform 520ms var(--ease),background 320ms var(--ease)}
input[type=checkbox][role=switch]:checked{background:var(--btn)}
input[type=checkbox][role=switch]:checked::after{left:4px;top:4px;width:24px;height:24px;border:0;background:var(--btn-fg);transform:translateX(22px)}
.consent label{padding-top:3px}
.cta-bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:linear-gradient(to top,var(--bg) 64%,transparent)}
main.detail~.cta-bar,.cta-bar.on-card{background:linear-gradient(to top,var(--card) 64%,transparent)}
.cta-in{max-width:480px;margin:0 auto;padding:22px var(--gut) calc(14px + var(--safe-b))}
.banner{display:flex;gap:10px;align-items:flex-start;padding:14px 18px;border-radius:var(--r-s);background:var(--card);font-size:.875rem;line-height:1.45}
.banner .ico{width:20px;height:20px;margin-top:1px}
.banner.bad{box-shadow:inset 0 0 0 2px var(--text);font-weight:500}
.banner.mb{margin-bottom:10px}
.check-ring{width:84px;height:84px;border-radius:50%;background:var(--btn);color:var(--btn-fg);display:grid;place-items:center;margin-bottom:22px}
.check-ring .ico{width:38px;height:38px;stroke-width:2.2}
.stack{display:grid;gap:12px;margin-top:28px}

/* ===== БЛОК: кабінет, сегменти ===== */
.loy{background:var(--bar);color:var(--on-bar);border-radius:var(--r-m);padding:24px 22px;box-shadow:var(--shadow)}
.loy .cap{color:var(--on-bar-2)}
.loy .st{font-family:var(--f-serif);font-weight:800;font-size:2.2rem;line-height:1;letter-spacing:-.02em;margin:6px 0 18px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.stats b{display:block;font-family:var(--f-serif);font-weight:800;font-size:1.7rem;line-height:1}
.stats span{font-size:.75rem;color:var(--on-bar-2)}
progress{width:100%;height:4px;appearance:none;-webkit-appearance:none;border:0;border-radius:2px;background:rgba(255,255,255,.28);display:block}
progress::-webkit-progress-bar{background:rgba(255,255,255,.28);border-radius:2px}
progress::-webkit-progress-value{background:var(--on-bar);border-radius:2px}
progress::-moz-progress-bar{background:var(--on-bar);border-radius:2px}
.loy .small{color:var(--on-bar-2);margin-top:10px}
.seg{display:flex;background:var(--card);border-radius:var(--pill);padding:5px;margin:26px 0 16px;box-shadow:inset 0 0 0 1.5px var(--line)}
.seg button{flex:1;min-height:46px;text-align:center;border-radius:var(--pill);font-size:.75rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;transition:background 320ms var(--ease),color 320ms var(--ease)}
.seg button[aria-selected="true"]{background:var(--btn);color:var(--btn-fg)}
.seg.t0{margin-top:6px}
.seg.g4{display:grid;grid-template-columns:repeat(2,1fr);gap:2px;border-radius:30px}
.rule{font-size:.8125rem;color:var(--t2);margin-bottom:14px}
.visit{background:var(--card);border-radius:var(--r-m);box-shadow:var(--shadow);padding:22px}
.visit+.visit{margin-top:14px}
.visit .when{font-family:var(--f-serif);font-weight:800;font-size:1.45rem;line-height:1.05;letter-spacing:-.01em}
.visit .tags{margin-top:8px}
.visit .what{margin-top:12px;font-weight:500;font-size:1rem;line-height:1.35}
.visit .who{font-size:.875rem;color:var(--t2);font-weight:300;margin-top:2px}
.visit .acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.visit .acts>*{flex:1 1 130px;padding:0 14px}
.lock{display:flex;gap:10px;margin-top:14px;font-size:.8125rem;line-height:1.45;color:var(--t2)}
.lock .ico{width:18px;height:18px;margin-top:1px}

/* ===== БЛОК: сповіщення ===== */
.notif{background:var(--card);border-radius:var(--r-m);box-shadow:var(--shadow)}
.notif+.notif{margin-top:14px}
.notif summary{list-style:none;display:flex;gap:14px;align-items:flex-start;padding:20px;cursor:pointer}
.notif summary::-webkit-details-marker{display:none}
.notif .nt{flex:1;min-width:0}
.notif .nt b{display:block;font-weight:500;font-size:1rem;line-height:1.3}
.notif .nt span.sub{display:block;font-weight:300;font-size:.8125rem;line-height:1.4;color:var(--t2);margin-top:3px}
.notif .nt .cap{display:block;margin-top:10px;text-align:right;font-weight:400;letter-spacing:.06em;text-transform:none;font-size:.6875rem}
.notif .go{transition:transform 520ms var(--ease)}
.notif[open] .go{transform:rotate(90deg)}
.notif .nb{padding:0 20px 20px}
.bub{background:var(--bg);border-radius:6px 22px 22px 22px;padding:16px 18px;font-size:.875rem;line-height:1.5}
.bub p{max-width:none}
.bub p+p{margin-top:8px}
.bub b{font-weight:500}
.kb{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.kb span{flex:1 1 auto;min-height:42px;padding:0 14px;display:grid;place-items:center;border-radius:var(--r-s);background:var(--bg);font-size:.8125rem;font-weight:500;text-align:center}
.kb.stars span{flex:1 1 40px;padding:0}

/* ===== БЛОК: нижня навігація (темна закруглена панель, плаваюча кнопка «Запис») ===== */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:0 12px calc(12px + var(--safe-b));pointer-events:none}
.tabs[hidden]{display:none}
.tabs-in{pointer-events:auto;max-width:456px;margin:0 auto;position:relative;background:var(--bar);border-radius:34px;box-shadow:var(--shadow-bar);display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;height:68px;padding:0 4px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--on-bar-2);text-align:center;transition:color 320ms var(--ease)}
.tab .ico{width:22px;height:22px;stroke-width:1.9}
.tab .tl{font-size:.5625rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.tab[aria-current="page"]{color:var(--on-bar)}
.tab[aria-current="page"] .ico{stroke-width:2.4}
.tab-fab{position:relative;justify-content:flex-end;padding-bottom:10px;color:var(--on-bar)}
.fab{position:absolute;left:50%;top:-24px;transform:translateX(-50%);width:62px;height:62px;border-radius:50%;background:var(--fab);color:var(--fab-fg);display:grid;place-items:center;box-shadow:0 0 0 6px var(--bg),0 12px 24px -8px rgba(33,25,23,.55);transition:transform 620ms var(--ease)}
.fab .ico{width:26px;height:26px;stroke-width:2.2}
.tab-fab:hover .fab{transform:translateX(-50%) rotate(90deg)}
#toast{position:fixed;left:50%;bottom:calc(104px + var(--safe-b));transform:translate(-50%,24px);opacity:0;pointer-events:none;z-index:60;max-width:min(440px,calc(100vw - 32px));background:var(--btn);color:var(--btn-fg);padding:14px 22px;border-radius:var(--pill);font-size:.875rem;font-weight:500;transition:opacity 500ms var(--ease),transform 500ms var(--ease)}
#toast.show{opacity:1;transform:translate(-50%,0)}
dialog{border:0;padding:0;background:var(--card);color:var(--text);width:100%;max-width:480px;margin:auto auto 0;border-radius:var(--r-xl) var(--r-xl) 0 0;max-height:90dvh;overflow:auto}
dialog::backdrop{background:rgba(20,16,12,.55)}
.sheet{padding:14px var(--gut) calc(26px + var(--safe-b))}
.sheet::before{content:"";display:block;width:44px;height:4px;border-radius:2px;background:var(--line-s);margin:0 auto 22px}
.sheet h2{margin-bottom:14px}
.sheet p+p{margin-top:10px}
.sheet .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.sheet .row>*{flex:1 1 140px}
.sheet .gt{margin:24px 0 10px}
.swrow,.chkrow{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:52px;font-size:.9375rem;cursor:pointer}
.chkrow+.chkrow{box-shadow:inset 0 1px 0 var(--line)}
.range{position:relative;height:40px;margin:6px 6px 0}
.range .trk,.range .fill{position:absolute;top:18px;height:4px;border-radius:2px}
.range .trk{left:0;right:0;background:var(--line)}
.range .fill{background:var(--text)}
.range input{position:absolute;left:-6px;right:-6px;width:calc(100% + 12px);top:0;height:40px;margin:0;background:none;pointer-events:none;appearance:none;-webkit-appearance:none}
.range input::-webkit-slider-runnable-track{background:none;height:40px}
.range input::-moz-range-track{background:none;height:40px}
.range input::-webkit-slider-thumb{pointer-events:auto;-webkit-appearance:none;width:26px;height:26px;margin-top:7px;border-radius:50%;background:var(--card);border:3px solid var(--text);cursor:pointer}
.range input::-moz-range-thumb{pointer-events:auto;width:20px;height:20px;border-radius:50%;background:var(--card);border:3px solid var(--text);cursor:pointer}
.range-l{display:flex;justify-content:space-between;font-size:.75rem;color:var(--t2);margin-top:4px}
.rv{font-weight:500;font-size:.9375rem;margin-bottom:6px}

/* ===== БЛОК: адмін-панель (макет) ===== */
.acard{background:var(--card);border-radius:var(--r-m);box-shadow:var(--shadow);padding:18px 20px}
.acard+.acard{margin-top:12px}
.acard .mhead .nm{font-size:1.15rem}
.acard>.nm{display:block;font-weight:500;font-size:1rem;line-height:1.3}
.acard .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.acard .acts>*{flex:1 1 100px}
.frow{display:grid;grid-template-columns:1fr 92px 92px;gap:8px;align-items:center;padding:6px 0}
.frow .dn{display:flex;gap:12px;align-items:center;font-size:.9375rem;font-weight:500;text-transform:uppercase;letter-spacing:.08em}
.frow select{min-height:46px;padding:0 14px;border-radius:var(--pill);border:0;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);font-size:.875rem;appearance:none;-webkit-appearance:none;text-align:center}
.frow.off select{opacity:.4}
.photo-pick{display:flex;gap:16px;align-items:center}
.photo-pick .btns{display:flex;flex-direction:column;gap:8px}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.subrow{display:grid;grid-template-columns:1fr 84px 70px 36px;gap:6px;align-items:center;margin-bottom:8px}
.subrow input{min-height:46px;padding:0 14px !important;font-size:.875rem !important}
.rm{width:36px;height:36px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line-s);display:grid;place-items:center}
.rm .ico{width:16px;height:16px}
.stepper{display:flex;align-items:center;gap:12px}
.stepper b{min-width:24px;text-align:center;font-family:var(--f-serif);font-weight:800;font-size:1.3rem}
.stepper .iconbtn{box-shadow:inset 0 0 0 1.5px var(--line-s);background:transparent;width:40px;height:40px}

/* ===== БЛОК: заставка, скелетони, помилка, анімація входу ===== */
#splash{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;transition:opacity 700ms var(--ease);cursor:pointer}
#splash.out{opacity:0;pointer-events:none}
.splash-card{width:min(74vw,320px);aspect-ratio:1;border-radius:var(--r-xl);background:#FFFFFF;box-shadow:var(--shadow);display:grid;place-items:center;overflow:hidden}
.splash-card img{width:92%;height:92%;object-fit:contain;display:block}
.splash-h{position:absolute;left:0;right:0;bottom:calc(36px + var(--safe-b));text-align:center}
.sk{border-radius:var(--r-m);background:var(--surface);height:84px;animation:pulse 1400ms var(--ease) infinite alternate}
.sk+.sk{margin-top:12px}
.sk.t{height:44px;width:62%;margin-bottom:22px;border-radius:var(--pill)}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
.fail{padding:30px 0}
.fail p{margin:10px 0 22px;color:var(--t2)}
.rise{opacity:0;transform:translateY(28px);filter:blur(14px)}
.is-in .rise{opacity:1;transform:none;filter:blur(0);transition:opacity 900ms var(--ease) var(--d,0ms),transform 900ms var(--ease) var(--d,0ms),filter 900ms var(--ease) var(--d,0ms)}
@media (prefers-reduced-motion:reduce){
  .rise{opacity:1;transform:none;filter:none}
  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
@media (max-width:360px){
  .mark span{letter-spacing:.2em}
  .tab .tl{font-size:.5rem;letter-spacing:.02em}
  .cover h1{font-size:1.55rem}
  .top{gap:8px}
}
@media (min-width:481px){ body{background:color-mix(in srgb,var(--bg) 90%,var(--text))} #app{background:var(--bg)} }
</style>
</head>

  getAdmin() { return this._call(() => ({ masters:cp(STORE.masters), services:cp(STORE.services), resources:cp(STORE.resources), salon:{ src: STORE.salonPhoto || DEFAULT_PHOTO, custom: !!STORE.salonPhoto } }), 200); },
  createMaster(d) {
    return this._call(() => { const m = { id:'m' + (++STORE.seq), ratings:[], bio:'', ...d, photo:d.photo || null }; STORE.masters.push(m); return cp(m); }, 400);
  },
  updateMaster(id, d) {
    return this._call(() => { const m = masterOf(id); if (!m) throw new ApiError('NOT_FOUND', 'Майстра не знайдено'); Object.assign(m, d); return cp(m); }, 400);
  },
  deleteMaster(id) {
    return this._call(() => {
      if (hasFuture(v => v.masterId === id)) throw new ApiError('HAS_VISITS', 'У майстра є майбутні записи');
      STORE.masters = STORE.masters.filter(m => m.id !== id);
    }, 400);
  },
  upsertService(d) {
    return this._call(() => {
      const old = d.id ? svcOf(d.id) : null;
      if (old) {
        /* значення, змінене адміністратором, більше не демо */
        if (!d.subs) { d.dp = old.from === d.from ? old.dp : false; d.dm = old.min === d.min ? old.dm : false; }
        else d.subs.forEach(z => { const o = (old.subs || []).find(x => x.id === z.id); z.dp = o && o.from === z.from ? o.dp : false; z.dm = o && o.min === z.min ? o.dm : false; });
        Object.assign(old, d); if (!d.subs) delete old.subs; return cp(old);
      }
      const s = { ...d, id:'s' + (++STORE.seq) }; if (!s.subs) delete s.subs; STORE.services.push(s); return cp(s);
    }, 400);
  },
  deleteService(id) {
    return this._call(() => {
      if (hasFuture(v => v.serviceId === id)) throw new ApiError('HAS_VISITS', 'Є майбутні записи на цю послугу');
      STORE.services = STORE.services.filter(s => s.id !== id);
      STORE.masters.forEach(m => { m.services = m.services.filter(x => x !== id); });
    }, 400);
  },
  setResourceQty(id, qty) { return this._call(() => { const r = resOf(id); if (r) r.qty = Math.max(1, Math.min(9, qty)); return cp(STORE.resources); }, 150); }
};

const tg = window.Telegram && window.Telegram.WebApp;
/* [ПОТРІБНО ПЕРЕВІРИТИ: на реальному пристрої, чи platform поза Telegram дорівнює 'unknown', і чи є initData при запуску з keyboard button] */
const inTG = !!(tg && (tg.initData || (tg.platform && tg.platform !== 'unknown')));
const tgv = v => { try { return !!(tg && tg.isVersionAtLeast && tg.isVersionAtLeast(v)); } catch (e) { return false; } };
const host = {
  init() {
    if (!inTG) return;
    try { tg.ready(); tg.expand(); } catch (e) {}
    try { tg.onEvent('themeChanged', applyTheme); } catch (e) {}
    try { if (tgv('6.1')) tg.BackButton.onClick(() => back()); } catch (e) {}
  },
  scheme() { if (inTG && tg.colorScheme) return tg.colorScheme; return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; },
  paint() {
    if (!inTG) return;
    const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    try { if (tgv('6.9')) { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } } catch (e) {}
    try { if (tgv('7.10')) tg.setBottomBarColor(bg); } catch (e) {}
  },
  setBack(show) { try { if (inTG && tgv('6.1')) show ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {} },
  haptic(kind) {
    try { if (!inTG || !tgv('6.1')) return;
      if (kind === 'tap') tg.HapticFeedback.selectionChanged(); else tg.HapticFeedback.notificationOccurred(kind);
    } catch (e) {}

function dayWord(ms) {
  const diff = Math.round((startOfDay(ms) - startOfDay(now())) / 864e5), d = new Date(ms);
  if (diff === 0) return 'Сьогодні'; if (diff === 1) return 'Завтра'; return WD[d.getDay()] + ', ' + d.getDate() + ' ' + MO[d.getMonth()].slice(0, 4) + '.';
}
const fullDate = ms => { const d = new Date(ms); return WD[d.getDay()] + ', ' + d.getDate() + ' ' + MO[d.getMonth()]; };
const winLabel = ms => dayWord(ms) + ' ' + hm(ms);
function leftLabel(ms) {
  const h = Math.floor(ms / 36e5); if (h < 24) return h + NB + 'год';
  return Math.floor(h / 24) + NB + 'дн' + NB + (h % 24) + NB + 'год';
}

const skeleton = (n = 4) => '<div class="sk t"></div>' + Array.from({ length:n }, () => '<div class="sk"></div>').join('');
const errorView = () => `<div class="fail rise"><h2>Не вдалося завантажити</h2><p>Перевірте з’єднання й спробуйте ще раз. Ваші дані не втрачено.</p><button class="btn" data-action="retry"><span>Спробувати ще раз</span></button></div>`;
const VIEWS = {};

async function renderScreen(opts = {}) {
  const token = ++S.token, sc = S.screen, v = VIEWS[sc.name];
  view.className = v.cls || '';
  if (!opts.quiet) { view.classList.remove('is-in'); view.innerHTML = v.skel ? v.skel(sc) : skeleton(); }
  chrome();
  if (!opts.quiet) window.scrollTo(0, 0);
  try {
    const html = await v.render(sc);
    if (token !== S.token) return;
    view.innerHTML = html;
    view.querySelectorAll('.rise').forEach((el, i) => el.style.setProperty('--d', Math.min(i * 60, 540) + 'ms'));
    requestAnimationFrame(() => view.classList.add('is-in'));
    if (v.after) v.after(sc);
    if (!opts.quiet) view.focus({ preventScroll:true });
  } catch (e) {
    if (token !== S.token) return;
    view.innerHTML = errorView(); view.classList.add('is-in');
  }
}
function chrome() {

function priceBounds() {
  const ps = []; STORE.services.forEach(s => { if (needsSub(s)) s.subs.forEach(z => z.from != null && ps.push(z.from)); else if (s.from != null) ps.push(s.from); });
  if (!ps.length) return [0, 1000];
  return [Math.floor(Math.min(...ps) / 50) * 50, Math.ceil(Math.max(...ps) / 50) * 50];
}
const curRange = () => { const [a, b] = priceBounds(), F = S.filter; return [F.min == null ? a : F.min, F.max == null ? b : F.max]; };
const priceNarrow = () => { const [a, b] = priceBounds(), [lo, hi] = curRange(); return lo > a || hi < b; };
const filterCount = () => (S.filter.cats.length ? 1 : 0) + (priceNarrow() ? 1 : 0) + (S.filter.today ? 1 : 0);
const minPrices = s => needsSub(s) ? s.subs.filter(z => z.from != null).map(z => z.from) : (s.from != null ? [s.from] : []);
const priceOk = s => { if (!priceNarrow()) return true; const [lo, hi] = curRange(), ps = minPrices(s); return !ps.length || ps.some(p => p >= lo && p <= hi); };  /* послуги без ціни не відсіюються: ціну ще не задано */
const svcPass = (s, av) => (!S.filter.cats.length || S.filter.cats.includes(s.cat)) && priceOk(s) && (!S.filter.today || !av || av.serviceIds.includes(s.id));
const masterPass = (m, av) => {
  const sv = m.services.map(svcOf).filter(Boolean);
  return (!S.filter.cats.length || sv.some(s => S.filter.cats.includes(s.cat))) && (!priceNarrow() || sv.some(priceOk)) && (!S.filter.today || !av || av.masterIds.includes(m.id));
};

const STEP_NAMES = ['Послуга', 'Майстер', 'Дата й час', 'Підтвердження'];
const progress = F => `<div class="prog" aria-hidden="true">${STEP_NAMES.map((_, i) => `<i class="${i < F.step ? 'on' : ''}"></i>`).join('')}</div><p class="cap step-l">Крок ${F.step} з 4: ${STEP_NAMES[F.step - 1]}</p>`;
const picksBar = F => {
  const parts = [];
  if (F.serviceId && svcOf(F.serviceId)) { const e = effOf(F.serviceId, F.subId); parts.push(`<button class="chip sm on" data-action="jump-step" data-step="1">${esc(e.name)}</button>`); }

  return parts.length ? `<div class="picks">${parts.join('')}</div>` : '';
};
async function pickerHtml(P) {
  const days = await api.getDays(P);
  const firstFree = days.find(d => d.free > 0);
  if (!P.date || !days.some(d => d.free > 0 && d.day === P.date)) { P.date = firstFree ? firstFree.day : null; P.start = null; }
  return `<div class="strip rise" role="group" aria-label="Дата">${days.map(d => { const dt = new Date(d.day);
      return `<button class="dbtn ${d.off ? 'off' : ''}" data-action="pick-date" data-day="${d.day}" aria-pressed="${d.day === P.date}" ${d.free ? '' : 'disabled'} aria-label="${fullDate(d.day)}${d.off ? ', вихідний' : d.free ? '' : ', вільних місць немає'}"><span>${WD[dt.getDay()]}</span><b>${dt.getDate()}</b></button>`; }).join('')}</div>
    <div id="slots" class="rise" aria-live="polite">${firstFree ? '' : emptyHtml('Вільних місць немає', 'Найближчими двома тижнями немає вільного часу. Спробуйте іншого майстра або послугу.')}</div>`;
}
async function loadSlots(P) {
  const box = $('#slots'); if (!box || !P.date) return;
  box.innerHTML = '<div class="times"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>';
  const day = P.date;
  try {
    const { dur, slots } = await api.getSlots(P);
    if (P.date !== day) return;
    if (!slots.length) { box.innerHTML = emptyHtml('На цей день місць немає', 'Оберіть іншу дату зі смуги вище.'); return; }
    const reasons = new Set(slots.filter(s => !s.ok).map(s => s.reason));
    const lastStart = Math.floor((CLOSE - dur - OPEN) / STEP) * STEP + OPEN;
    box.innerHTML = `<div class="times">${slots.map(s => s.ok
      ? `<button class="chip ${s.start === P.start ? 'on' : ''}" data-action="pick-time" data-start="${s.start}" aria-pressed="${s.start === P.start}">${hm(s.start)}</button>`
      : `<button class="chip dis" disabled aria-disabled="true" title="${s.reason === 'END' ? 'Процедура завершилась б після 17:00' : 'Обладнання зайняте'}">${hm(s.start)}</button>`).join('')}</div>` +
      (reasons.has('END') ? `<p class="note">${ico('alert')}<span>Неактивні години: процедура триває ${dur}${NB}хв і завершилась би після 17:00 (графік салону до 17:00). Останній можливий початок: ${hmMin(lastStart)}.</span></p>` : '') +
      (reasons.has('RESOURCE') ? `<p class="note">${ico('alert')}<span>Неактивні години: обладнання «${esc(resOf(svcOf(P.serviceId).resource).name)}» зайняте в цей час, навіть якщо майстер вільний.</span></p>` : '');
  } catch (e) {
    box.innerHTML = `<div class="banner bad">${ico('alert')}<span>Не вдалося завантажити час. <button class="lnk" data-action="reload-slots">Спробувати ще раз</button></span></div>`;
  }
}
const pickerBar = (P, action, note) => `<div class="cta-bar"><div class="cta-in"><div id="barErr"></div><button class="btn block" id="pickCta" data-action="${action}" ${P.start ? '' : 'disabled'}><span>${P.start ? '' : 'Оберіть час'}</span></button><span class="cta-note">${note}</span></div></div>`;
function refreshPickerBar() {
  const P = S.screen.name === 'resched' ? S.re : S.flow, b = $('#pickCta'); if (!b) return;
  b.disabled = !P.start;
  b.firstElementChild.textContent = P.start ? (S.screen.name === 'resched' ? `Перенести на ${hm(P.start)}, ${fullDate(P.start)}` : `Далі: підтвердження, ${hm(P.start)}`) : 'Оберіть час';
}

/* --- Візити (кабінет) --- */
function visitCard(v) {
  const e = visitEff(v), isUp = v.status !== 'cancelled' && v.start > now();
  const tag = v.status === 'cancelled' ? 'Скасовано' : v.status === 'pending_payment' ? 'Очікує передоплати' : isUp ? 'Підтверджено' : 'Завершено';
  let acts = '', note = '';
  if (isUp) {
    const ok = api.policy.changeAllowed(v), left = v.start - now();
    acts = `<button class="btn-line sm" data-action="resched" data-id="${v.id}" ${ok ? '' : 'disabled'}>Перенести</button><button class="btn-line sm" data-action="cancel-ask" data-id="${v.id}" ${ok ? '' : 'disabled'}>Скасувати</button>`;
    if (v.status === 'pending_payment') acts += `<button class="btn sm" data-action="goto-pay" data-id="${v.id}"><span>Сплатити передоплату</span></button>`;
    note = ok ? `<p class="lock">${ico('cal')}<span>Змінити чи скасувати можна ще ${leftLabel(left - HOURS_LIMIT * 36e5)}</span></p>`
      : `<p class="lock">${ico('lock')}<span>До візиту ${leftLabel(left)}: перенос і скасування доступні не пізніше ніж за 24${NB}години. Для змін зателефонуйте адміністратору: <a class="lnk" href="tel:${SALON.tel}">${SALON.phone}</a>.</span></p>`;
  } else if (v.status !== 'cancelled') acts = `<button class="btn-line sm" data-action="again" data-id="${v.serviceId}" data-sub="${v.subId || ''}">Повторити запис</button>`;
  return `<article class="visit rise"><div class="when">${dayWord(v.start)} ${hm(v.start)}</div><div class="tags"><span class="tag">${tag}</span></div>
    <p class="what">${esc(e.name)}</p><p class="who">${esc(mName(v.masterId))}${e.from != null ? ' / ' + (e.approx ? 'від ' : '') + grn(e.from) : ''}</p>${note}${acts ? `<div class="acts">${acts}</div>` : ''}</article>`;
}

const setBusy = (btn, on) => { if (!btn) return; btn.disabled = on; btn.classList.toggle('is-busy', on); };
const showBarErr = html => { const b = $('#barErr'); if (b) b.innerHTML = html ? `<div class="banner bad mb" role="alert">${ico('alert')}<span>${html}</span></div>` : ''; };
const FAILS = { SLOT_TAKEN:'Цей час щойно зайняли. Оберіть інший.', TOO_LATE:'Змінити візит уже не можна: до початку менше 24 годин.', DAY_OFF:'Неділя вихідний день.', OUT_OF_HOURS:'Процедура завершилась би після 17:00. Оберіть раніший час.', RESOURCE_BUSY:'Обладнання зайняте в цей час. Оберіть інший час.', NO_DURATION:'Для цієї послуги не задано тривалість: запис онлайн недоступний.', HAS_VISITS:'Є майбутні записи: спочатку перенесіть або скасуйте їх.' };
const failMsg = e => FAILS[e.code] || 'Не вдалося виконати дію: немає зв’язку. Спробуйте ще раз.';
function startBooking(p = {}) {
  const s = p.serviceId ? svcOf(p.serviceId) : null;
  if (p.serviceId && (!s || !bookable(s))) { toast('Запис онлайн на цю процедуру недоступний. Зателефонуйте адміністратору.'); return; }
  S.flow = { step:1, min:1, serviceId:p.serviceId || null, subId:p.subId || null, masterId:p.masterId || null, date:null, start:null, name:host.user(), phone:'', consent:false, errors:{} };
  if (s && (!needsSub(s) || S.flow.subId)) { S.flow.step = 2; S.flow.min = 2; }
  if (S.flow.step === 2 && S.flow.masterId && S.flow.masterId !== 'any') { S.flow.step = 3; S.flow.min = 3; }
  S.stack = S.screen.name === 'done' ? [] : S.stack;
  go('book');
}
function advanceFromService() {
  const F = S.flow;
  F.step = (F.masterId && F.masterId !== 'any' && masterOf(F.masterId) && masterOf(F.masterId).services.includes(F.serviceId)) ? 3 : 2;
  if (F.step === 2) F.masterId = null;
  renderScreen();
}
function chooseService(id) {
  const F = S.flow, s = svcOf(id);
  if (F.serviceId !== id) { F.serviceId = id; F.subId = null; F.date = null; F.start = null; }
  if (needsSub(s) && !F.subId) { F.step = 1; renderScreen(); return; }
  advanceFromService();
}
async function confirmBooking(btn) {
  const F = S.flow, E = {}, name = F.name.trim();
  const d = F.phone.replace(/[^\d+]/g, ''); let ph = d;
  if (/^0\d{9}$/.test(d)) ph = '+38' + d; else if (/^380\d{9}$/.test(d)) ph = '+' + d;
  if (name.length < 2) E.name = 'Вкажіть ім’я, щоб майстер знав, як до вас звертатись';
  if (!/^\+380\d{9}$/.test(ph)) E.phone = 'Вкажіть номер у форматі +380XXXXXXXXX';
  if (!F.consent) E.consent = 'Без згоди на обробку персональних даних запис неможливий';
  F.errors = E;
  for (const k of ['name', 'phone', 'consent']) { $('#e-' + k).innerHTML = E[k] ? ico('alert') + esc(E[k]) : ''; const i = $('#f-' + k); if (i) i.setAttribute('aria-invalid', !!E[k]); }
  if (Object.keys(E).length) { host.haptic('error'); const first = $('#f-' + Object.keys(E)[0]); first && first.focus(); return; }
  showBarErr(''); setBusy(btn, true);
  try {
    const v = await api.createBooking({ serviceId:F.serviceId, subId:F.subId, masterId:F.masterId, start:F.start, client:{ name, phone:ph } });
    host.haptic('success'); S.stack = [];
    if (v.deposit) replace('pay', { id:v.id }); else replace('done', { id:v.id });
  } catch (e) {
    host.haptic('error'); setBusy(btn, false);
    showBarErr(esc(failMsg(e)) + (['SLOT_TAKEN', 'OUT_OF_HOURS', 'RESOURCE_BUSY', 'DAY_OFF'].includes(e.code) ? ' <button class="lnk" data-action="jump-step" data-step="3">Обрати інший час</button>' : ''));
  }
}

}
async function scenario(kind, btn) {
  setBusy(btn, true);
  try {
    let F = { step:3, min:1, serviceId:'combo', subId:null, masterId:'any', date:null, start:null, name:host.user(), phone:'', consent:false, errors:{} };
    if (kind === 'res') { const r = await api.prepareResourceDemo(); F = { ...F, serviceId:'laser', subId:'forearm', date:r.day }; toast('Демо: Віра Т. зайнята о 14:00, апарат лазерної епіляції один, тож 14:00 недоступний і для Оксани Б.'); }
    closeSheet(); S.flow = F; S.stack = [{ name:'home' }]; S.screen = { name:'book' }; renderScreen();
  } catch (e) { setBusy(btn, false); toast(failMsg(e)); }
}
const ACTIONS = {

  'book-master': b => startBooking({ masterId:b.dataset.id }),

  },
  'sheet-close': () => closeSheet(),
  policy: () => openSheet(`<h2>Політика конфіденційності</h2><p>${mark('Текст політики конфіденційності буде додано перед запуском.', '[ПОТРІБНО ВІД КЛІЄНТА: текст політики конфіденційності та назва юридичної особи].')}</p><p class="t2">У прототипі тут заглушка. Збираємо лише ім’я та телефон, потрібні для запису.</p><div class="row"><button class="btn-line" data-action="sheet-close">Закрити</button></div>`),
  demo: () => openDemo(),
  clock: b => { const h = +b.dataset.h; DEMO.offset = h === 0 ? 0 : DEMO.offset + h * 36e5; openDemo(); if (S.flow) { S.flow.date = null; S.flow.start = null; } if (S.re) { S.re.date = null; S.re.start = null; } renderScreen(); },
  theme: b => { S.themePref = b.dataset.id; applyTheme(); openDemo(); },
  'reset-demo': () => { resetStore(); DEMO.offset = 0; DEMO.failNext = false; S.flow = null; S.re = null; S.am = null; S.as = null; S.cabTab = 'up'; S.filter = FILTER0(); closeSheet(); switchTab('home'); toast('Демо-дані скинуто'); },
  'scn-end': b => scenario('end', b),
  'scn-res': b => scenario('res', b),
  'open-admin': () => { closeSheet(); go('admin'); },
  'open-filter': () => { S.fscope = S.screen.name === 'masters' ? 'masters' : 'services'; openFilter(); },
  fscope: b => { S.fscope = b.dataset.id; document.querySelectorAll('[data-action=fscope]').forEach(x => x.setAttribute('aria-selected', x === b)); },
  'filter-apply': () => {
    const F = S.filter, [bmin, bmax] = priceBounds(), lo = +$('#f-min').value, hi = +$('#f-max').value;

    F.min = lo <= bmin ? null : lo; F.max = hi >= bmax ? null : hi; F.scope = S.fscope || 'services'; closeSheet();
    const target = F.scope === 'masters' ? 'masters' : 'services';

  },
  'filter-reset': () => { const sc = S.fscope; S.filter = FILTER0(); S.filter.scope = sc || 'services'; if ($('#sheet').open) openFilter(); else renderScreen(); },
  /* адмін */
  'adm-photo-reset': async () => { await api.setSalonPhoto(null); toast('Повернено стандартне фото салону'); renderScreen({ quiet:true }); },
  'adm-tab': b => { S.adminTab = b.dataset.id; renderScreen({ quiet:true }); },
  'am-new': () => { S.am = null; go('admin-master', { id:'new' }); },
  'am-edit': b => { S.am = null; go('admin-master', { id:b.dataset.id }); },
  'am-nophoto': () => { S.am.photo = null; $('#a-prev').textContent = initials(S.am.name || 'Фото'); },
  'am-save': async b => {
    const D = S.am, errs = [];
    if (D.name.trim().length < 2) errs.push('Вкажіть ім’я майстра.');
    if (!D.services.length) errs.push('Оберіть хоча б одну послугу.');
    for (const d of [1, 2, 3, 4, 5, 6]) if (D.sched[d] && D.sched[d][0] >= D.sched[d][1]) errs.push(WDL[d] + ': кінець має бути пізніше за початок.');
    if (!Object.values(D.sched).some(Boolean)) errs.push('Вкажіть хоча б один робочий день.');
    $('#a-name').setAttribute('aria-invalid', D.name.trim().length < 2);
    if (errs.length) { showBarErr(esc(errs.join(' '))); host.haptic('error'); return; }
    showBarErr(''); setBusy(b, true);
    try {
      const data = { name:D.name.trim(), spec:D.spec, photo:D.photo, services:D.services, sched:D.sched };
      if (D.id) await api.updateMaster(D.id, data); else await api.createMaster(data);
      S.am = null; host.haptic('success'); toast('Майстра збережено (демо)'); back();
    } catch (e) { setBusy(b, false); showBarErr(esc(failMsg(e))); }
  },
  'am-del': async b => {
    const m = await api.getMaster(b.dataset.id);
    openSheet(`<h2>Видалити майстра?</h2><p>${esc(m.name)}, ${esc(m.spec)}.</p><p class="t2">Майстра не можна видалити, якщо в нього є майбутні записи.</p><div id="sheetErr"></div>
      <div class="row"><button class="btn" data-action="am-del-do" data-id="${m.id}"><span>Так, видалити</span></button><button class="btn-line" data-action="sheet-close">Залишити</button></div>`);
  },
  'am-del-do': async b => {

    catch (e) { setBusy(b, false); $('#sheetErr').innerHTML = `<div class="banner bad mt12" role="alert">${ico('alert')}<span>${esc(failMsg(e))}</span></div>`; }

  'as-new': () => go('admin-service', { id:'new' }),
  'as-edit': b => go('admin-service', { id:b.dataset.id }),
  'as-add': () => { const d = readAS(); S.as.subs = d.subs; S.as.subs.push({ id:'z' + (++STORE.seq), name:'', from:null, min:null }); $('#subs').innerHTML = subRows(S.as.subs); },
  'as-rm': b => { const d = readAS(); S.as.subs = d.subs; S.as.subs.splice(+b.dataset.i, 1); $('#subs').innerHTML = subRows(S.as.subs); },
  'as-save': async b => {
    const d = readAS(), E = {};
    if (d.name.length < 2) E['e-sname'] = 'Вкажіть назву послуги.';
    if (d.from != null && (isNaN(d.from) || d.from < 0)) E['e-sprice'] = 'Ціна має бути числом від 0.';
    if (d.min != null && (isNaN(d.min) || d.min < 5 || d.min > 480)) E['e-smin'] = 'Тривалість: від 5 до 480 хв.';
    if (d.subs.some(z => !z.name)) E['e-ssub'] = 'Вкажіть назву кожної підкатегорії або видаліть порожній рядок.';
    else if (d.subs.some(z => !z.min || z.min < 5)) E['e-ssub'] = 'У кожної підкатегорії потрібна тривалість у хвилинах (від 5): без неї запис недоступний.';
    for (const id of ['e-sname', 'e-sprice', 'e-smin', 'e-ssub']) $('#' + id).innerHTML = E[id] ? ico('alert') + esc(E[id]) : '';
    if (Object.keys(E).length) { host.haptic('error'); return; }
    const out = { ...d }; if (!out.resource) delete out.resource; if (!out.inject) delete out.inject; if (!out.prepay) delete out.prepay;
    if (out.subs.length) { out.from = null; out.min = null; out.approx = false; } else delete out.subs;
    if (!out.id) delete out.id;
    setBusy(b, true);
    try { await api.upsertService(out); host.haptic('success'); toast('Послугу збережено (демо)'); back(); }
    catch (e) { setBusy(b, false); showBarErr(esc(failMsg(e))); }
  },
  'as-del': async b => {
    const s = svcOf(b.dataset.id);
    openSheet(`<h2>Видалити послугу?</h2><p>${esc(s.name)}</p><p class="t2">Послугу не можна видалити, якщо на неї є майбутні записи. Вона зникне й у майстрів.</p><div id="sheetErr"></div>
      <div class="row"><button class="btn" data-action="as-del-do" data-id="${s.id}"><span>Так, видалити</span></button><button class="btn-line" data-action="sheet-close">Залишити</button></div>`);
  },
  'as-del-do': async b => {
    setBusy(b, true);
    try { await api.deleteService(b.dataset.id); closeSheet(); toast('Послугу видалено (демо)'); renderScreen({ quiet:true }); }
    catch (e) { setBusy(b, false); $('#sheetErr').innerHTML = `<div class="banner bad mt12" role="alert">${ico('alert')}<span>${esc(failMsg(e))}</span></div>`; }
  },
  'res-inc': async b => { const r = resOf(b.dataset.id); await api.setResourceQty(r.id, r.qty + 1); renderScreen({ quiet:true }); },
  'res-dec': async b => { const r = resOf(b.dataset.id); await api.setResourceQty(r.id, r.qty - 1); renderScreen({ quiet:true }); }
};
function openSheet(html) { $('#sheetBody').innerHTML = html; const d = $('#sheet'); if (!d.open) d.showModal(); }
function closeSheet() { const d = $('#sheet'); if (d.open) d.close(); }
function openDemo() {

    <h3 class="cap gt">Адміністратор</h3>

    <label class="swrow"><span>Показувати службові позначки (що потрібно від клієнта)</span><input type="checkbox" id="marksToggle" role="switch" ${S.marks ? 'checked' : ''}></label>
    <h3 class="cap gt">Тема</h3>

/* ===== БЛОК: події ===== */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b || b.disabled) return;
  const fn = ACTIONS[b.dataset.action]; if (fn) fn(b, e);
});
document.addEventListener('input', e => {
  const t = e.target, f = t.dataset && t.dataset.field;
  if (f && S.flow && f !== 'consent') S.flow[f] = t.value;
  if (t.dataset && t.dataset.afield && S.am) S.am[t.dataset.afield] = t.value;
  if (t.matches && t.matches('.range input')) updateRange(t);
});
document.addEventListener('change', e => {
  const t = e.target, d = t.dataset || {};
  if (d.field === 'consent' && S.flow) S.flow.consent = t.checked;
  if (t.id === 'failToggle') DEMO.failNext = t.checked;
  if (t.id === 'marksToggle') { S.marks = t.checked; renderScreen({ quiet:true }); }
  if (d.afield && S.am) S.am[d.afield] = t.value;
  if (t.classList && t.classList.contains('a-serv') && S.am) S.am.services = [...document.querySelectorAll('.a-serv:checked')].map(x => x.value);
  if (d.aoff && S.am) { const k = d.aoff; S.am.sched[k] = t.checked ? [OPEN, CLOSE] : null; renderScreen({ quiet:true }); }
  if (d.asch && S.am) { const [k, i] = d.asch.split(':'); S.am.sched[k][+i] = +t.value; }
  if (t.id === 'a-salon-photo' && t.files && t.files[0]) {
    const f = t.files[0], err = $('#e-salon');
    if (!/^image\//.test(f.type)) { err.innerHTML = ico('alert') + 'Потрібен файл-зображення.'; return; }
    if (f.size > 8 * 1024 * 1024) { err.innerHTML = ico('alert') + 'Файл завеликий (до 8 МБ).'; return; }
    api.setSalonPhoto(URL.createObjectURL(f)).then(() => { toast('Фото салону оновлено (демо)'); renderScreen({ quiet:true }); }).catch(() => { err.innerHTML = ico('alert') + 'Не вдалося зберегти фото. Спробуйте ще раз.'; });
  }
  if (t.id === 'a-photo' && t.files && t.files[0]) {
    const f = t.files[0], err = $('#e-photo');
    if (!/^image\//.test(f.type)) { err.innerHTML = ico('alert') + 'Потрібен файл-зображення.'; return; }
    if (f.size > 5 * 1024 * 1024) { err.innerHTML = ico('alert') + 'Файл завеликий (до 5 МБ).'; return; }
    err.innerHTML = ''; S.am.photo = URL.createObjectURL(f); $('#a-prev').innerHTML = `<img src="${S.am.photo}" alt="">`;
  }
});
document.addEventListener('keydown', e => {
  const l = e.target && e.target.matches && e.target.matches('label[for][role=button]');
  if (l && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); const i = document.getElementById(e.target.getAttribute('for')); i && i.click(); }
});
$('#sheet').addEventListener('click', e => { if (e.target === e.currentTarget) closeSheet(); });
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

/* ===== БЛОК: заставка і старт ===== */
function initSplash() {
  const sp = $('#splash'); if (!sp) return;
  if (typeof LOGO === 'undefined' || location.hash === '#nosplash') { sp.remove(); return; }
  $('#splashLogo').src = LOGO;
  let done = false;
  const hide = () => { if (done) return; done = true; sp.classList.add('out'); setTimeout(() => sp.remove(), 800); };
  sp.addEventListener('click', hide);
  setTimeout(hide, matchMedia('(prefers-reduced-motion:reduce)').matches ? 700 : 1800);
}
host.init();
applyTheme();
initSplash();
renderScreen();
